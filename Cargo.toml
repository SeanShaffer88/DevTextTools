[package]
name = "devtexttools"
version = "0.7.2"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "DevTextTools — every online text and developer tool from 10 tool sites, in one offline Windows program."
license = "MIT"
keywords = ["windows", "text", "tools", "developer", "converter"]
categories = ["gui"]

[lib]
name = "devtexttools"
path = "src/lib.rs"

[[bin]]
name = "DevTextTools"
path = "src/main.rs"

[dependencies]
lopdf = "0.46"
base64 = "0.22"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[dev-dependencies]
lopdf = "0.46"
